<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@500;600&family=JetBrains+Mono:wght@400;700&family=Silkscreen&family=Space+Grotesk:wght@500;700&display=swap">
<style>html,body{margin:0;background:#000}canvas{display:block}
.pre{position:absolute;left:-9999px;font-family:'IBM Plex Sans Arabic';}.pre2{position:absolute;left:-9999px;font-family:'JetBrains Mono'}.pre3{position:absolute;left:-9999px;font-family:'Silkscreen'}.pre4{position:absolute;left:-9999px;font-family:'Space Grotesk'}</style>
</head><body>
<span class="pre">مرحبا</span><span class="pre2">w ← δ</span><span class="pre3">EPOCH</span><span class="pre4">LAB</span>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="timeline.js"></script>
<script>
const W=1920,H=1080,BAR=118,N=16;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const glowC=document.createElement('canvas');glowC.width=24;glowC.height=24;
const off=document.createElement('canvas');off.width=W;off.height=H;const o=off.getContext('2d');
let D,TLB,runs={};
const C={bg:'#07060f',ink:'#ece8ff',dim:'#7d77a6',faint:'#2a2644',mut:'#ff4f7b',hi:'#ffd39a',grid:'#14112a'};
const STOPS=[[0,[13,11,31]],[0.3,[38,28,84]],[0.55,[120,56,150]],[0.78,[255,96,140]],[1,[255,224,176]]];
function cmap(p){p=Math.round(p*7)/7;for(let i=0;i<STOPS.length-1;i++){const[a,ca]=STOPS[i],[b,cb]=STOPS[i+1];if(p<=b){const u=(p-a)/(b-a);return ca.map((v,j)=>Math.round(v+(cb[j]-v)*u));}}return STOPS[4][1];}
function rgb(c,a=1){return `rgba(${c[0]},${c[1]},${c[2]},${a})`;}
function ease(u){u=Math.max(0,Math.min(1,u));return u*u*(3-2*u);}
function rand(s){const x=Math.sin(s*12.9898)*43758.5453;return x-Math.floor(x);}

window.init=function(data,timing,script){
  window.SCRIPT={};for(const s of script)SCRIPT[s.id]=s.ar;
  D=data;TLB=TL.build(timing);
  for(const k in D.runs){const b=atob(D.runs[k].g),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);runs[k]={g:u,loss:D.runs[k].loss,acc:D.runs[k].acc,n:D.runs[k].acc.length};}
  window.HEART=Array.from(runs.normal.g.slice((runs.normal.n-1)*256,runs.normal.n*256),v=>v>127?1:0);
  // grain tiles
  window.grains=[];for(let g=0;g<4;g++){const c=document.createElement('canvas');c.width=480;c.height=270;const x=c.getContext('2d');const im=x.createImageData(480,270);for(let i=0;i<im.data.length;i+=4){const v=Math.random()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=14;}x.putImageData(im,0,0);grains.push(c);}
  return TLB.total;
};
function gridAt(run,ep){const r=runs[run];const i=Math.max(0,Math.min(r.n-1,Math.round(ep/2)));return{g:r.g.subarray(i*256,i*256+256),loss:r.loss[i],acc:r.acc[i],i};}

function drawPixels(x,y,size,g,opts={}){
  const cell=size/N,gap=Math.max(1,cell*0.09),alpha=opts.alpha??1;
  for(let j=0;j<N;j++)for(let i=0;i<N;i++){
    const p=g[j*N+i]/255;const c=cmap(p);
    let dx=0;if(opts.jitter){dx=(rand(j*31+i+opts.jitter)-.5)*opts.jitterAmt;}
    o.fillStyle=rgb(c,alpha);o.fillRect(x+i*cell+gap/2+dx,y+j*cell+gap/2,cell-gap,cell-gap);
  }
}
function pixelPanel(x,y,size,g,opts={}){
  // bloom
  {const sc=glowC.getContext('2d');sc.clearRect(0,0,24,24);const im=sc.createImageData(N,N);for(let i=0;i<256;i++){const c=cmap(g[i]/255);im.data[i*4]=c[0];im.data[i*4+1]=c[1];im.data[i*4+2]=c[2];im.data[i*4+3]=Math.round(60+195*g[i]/255);}sc.putImageData(im,4,4);
  o.save();o.imageSmoothingEnabled=true;o.imageSmoothingQuality='high';o.globalAlpha=0.45*(opts.alpha??1);const k=size/N;for(const s of[1.0,1.06]){const ex=4*k*s,cx0=x+size/2,cy0=y+size/2,full=size*s+2*ex;o.drawImage(glowC,cx0-full/2,cy0-full/2,full,full);}o.restore();}
  o.fillStyle=C.bg;o.globalAlpha=0.6*(opts.alpha??1);o.fillRect(x,y,size,size);o.globalAlpha=1;
  drawPixels(x,y,size,g,opts);
  o.strokeStyle='rgba(236,232,255,0.14)';o.lineWidth=1;o.strokeRect(x-8.5,y-8.5,size+17,size+17);
  // corner ticks
  o.strokeStyle='rgba(236,232,255,0.6)';o.lineWidth=2;const L=14;
  for(const[cx,cy,sx,sy]of[[x-9,y-9,1,1],[x+size+9,y-9,-1,1],[x-9,y+size+9,1,-1],[x+size+9,y+size+9,-1,-1]]){o.beginPath();o.moveTo(cx+sx*L,cy);o.lineTo(cx,cy);o.lineTo(cx,cy+sy*L);o.stroke();}
}
function label(t,x,y,size,color,align='left',font='Silkscreen'){if(font.includes('Arabic')&&align==='left'){align='left';}o.direction=font.includes('Arabic')?'rtl':'ltr';o.font=`${size}px '${font}'`;o.fillStyle=color;o.textAlign=align;o.textBaseline='alphabetic';o.fillText(t,x,y);}

function drawFormula(sc,t,x,y){
  o.direction='ltr';const parts=sc.f;const m=sc.mutT==null?0:ease((t-sc.mutT)/0.5);const fs=60;
  o.font=`700 ${fs}px 'JetBrains Mono'`;o.textAlign='left';o.textBaseline='alphabetic';
  let cx=x;
  for(const p of parts){
    const [txt,neu,kind]=p;
    if(neu===undefined){o.fillStyle=C.ink;o.fillText(txt,cx,y);cx+=o.measureText(txt).width;continue;}
    if(neu===null){ // highlighted, no mutation
      const pulse=0.6+0.4*Math.sin(t*3);o.save();o.shadowColor=C.hi;o.shadowBlur=24*pulse;o.fillStyle=C.hi;o.fillText(txt,cx,y);o.restore();cx+=o.measureText(txt).width;continue;}
    const wOld=o.measureText(txt).width;
    if(m<=0){o.fillStyle=C.ink;o.fillText(txt,cx,y);cx+=wOld;continue;}
    // old, struck
    o.globalAlpha=1-0.65*m;o.fillStyle=C.ink;o.fillText(txt,cx,y);o.globalAlpha=1;
    {const sp=Math.min(1,m*1.6),x1=cx-6,y1=y+8,x2=cx+wOld+6,y2=y-fs*0.78;o.strokeStyle=C.mut;o.lineWidth=6;o.lineCap='round';o.beginPath();o.moveTo(x1,y1);o.lineTo(x1+(x2-x1)*sp,y1+(y2-y1)*sp);o.stroke();}
    cx+=wOld;
    if(neu){
      const gl=t-sc.mutT<0.7?((rand(Math.floor(t*30))-.5)*14):0;
      o.save();o.globalAlpha=m;o.shadowColor=C.mut;o.shadowBlur=30;o.fillStyle=C.mut;o.fillText(neu,cx+14+gl,y-fs*0.95*(1-m)*0+0);o.restore();
      // caret arrow above
      cx+=o.measureText(neu).width+14+o.measureText(' ').width*0.6;
    }
    cx+=6;
  }
  label(sc.note.toUpperCase(),x,y+56,22,C.dim,'left','Silkscreen');
}

function sparkline(x,y,w,h,run,ep,maxEp){
  o.strokeStyle=C.faint;o.lineWidth=1;
  for(const v of[1,0.1,0.01]){const yy=y+h-(Math.log10(v)+3)/(3.5)*h;o.beginPath();o.moveTo(x,yy+.5);o.lineTo(x+w,yy+.5);o.stroke();}
  const r=runs[run],last=Math.min(r.n-1,Math.round(ep/2));if(last<1)return;
  o.strokeStyle=C.mut;o.lineWidth=2.5;o.beginPath();
  for(let i=0;i<=last;i+=1){const xx=x+(i*2)/maxEp*w,lv=Math.max(-3,Math.min(0.5,Math.log10(Math.max(1e-3,r.loss[i])))),yy=y+h-(lv+3)/3.5*h;i?o.lineTo(xx,yy):o.moveTo(xx,yy);}o.stroke();
  const xx=x+(last*2)/maxEp*w,lv=Math.max(-3,Math.min(0.5,Math.log10(Math.max(1e-3,r.loss[last])))),yy=y+h-(lv+3)/3.5*h;
  o.fillStyle=C.mut;o.beginPath();o.arc(xx,yy,5,0,7);o.fill();
  label('LOSS (LOG)',x,y-10,16,C.dim);
}

function background(t){
  o.fillStyle=C.bg;o.fillRect(0,0,W,H);
  o.strokeStyle=C.grid;o.lineWidth=1;const sp=48,off2=(t*6)%sp;
  for(let x=-sp+off2;x<W;x+=sp){o.beginPath();o.moveTo(x+.5,0);o.lineTo(x+.5,H);o.stroke();}
  for(let y=0;y<H;y+=sp){o.beginPath();o.moveTo(0,y+.5);o.lineTo(W,y+.5);o.stroke();}
}

function sceneExperiment(sc,t){
  const ep=TL.epochAt(sc,t),cur=gridAt(sc.run,ep);
  const maxEp=sc.k[sc.k.length-1][1];
  // chapter
  const ca=ease((t-0.2)/0.8);o.globalAlpha=ca;
  label(sc.chap,140,232,30,C.ink);label(sc.chapAr,140,280,30,C.dim,'left','IBM Plex Sans Arabic');
  o.globalAlpha=1;
  // formula
  const fa=ease((t-0.6)/0.8);o.globalAlpha=fa;drawFormula(sc,t,140,420);o.globalAlpha=1;
  // insets
  const iy=560,is=220;
  o.globalAlpha=ease((t-1.0)/0.8);
  pixelPanel(150,iy,is,HEART.map(v=>v*255),{});label('TARGET',150,iy+is+42,20,C.dim);label('ACC 100%',150,iy+is+74,20,'rgba(0,0,0,0)');
  if(sc.ref){const rg=gridAt(sc.ref,ep);pixelPanel(150+is+70,iy,is,rg.g,{});label(sc.refLabel||'ORIGINAL RULE',150+is+70,iy+is+42,20,C.dim);
    label('ACC '+(rg.acc*100).toFixed(0)+'%',150+is+70,iy+is+74,20,C.dim);}
  o.globalAlpha=1;
  // main
  const ms=640,mx=1140,my=150;
  let jitter=0,amt=0;
  if(sc.boomT&&t>sc.boomT){const k=Math.max(0,1-(t-sc.boomT)/2.5);jitter=Math.floor(t*30);amt=40*k;}
  pixelPanel(mx,my,ms,cur.g,{jitter,jitterAmt:amt});
  // stats
  const sy=my+ms+70;
  label('EPOCH',mx,sy,18,C.dim);label(String(Math.round(cur.i*2)).padStart(4,'0'),mx,sy+40,36,C.ink,'left','JetBrains Mono');
  label('ACCURACY',mx+200,sy,18,C.dim);label((cur.acc*100).toFixed(1)+'%',mx+200,sy+40,36,cur.acc>.95?C.hi:C.ink,'left','JetBrains Mono');
  sparkline(mx+420,sy+2,220,44,sc.run,ep,maxEp);
}

function sceneIntro(sc,t){
  // pixels appear in random order, flickering noise from the untrained network
  const g0=gridAt('normal',0).g,g=new Uint8Array(256);
  for(let i=0;i<256;i++){const appear=0.3+rand(i+1)*3.5;if(t<appear){g[i]=0;continue;}
    const flick=t<5?(rand(i*7+Math.floor(t*12))*255):g0[i];g[i]=t<5?Math.round(flick*0.6+g0[i]*0.4):g0[i];}
  const ms=640,mx=(W-ms)/2,my=(H-ms)/2-20;
  pixelPanel(mx,my,ms,g,{alpha:ease(t/1.5)});
  const ta=ease((t-(sc.dur-4.6))/1.0)*(1-ease((t-(sc.dur-1.0))/0.8));
  if(ta>0){o.save();o.globalAlpha=ta;o.fillStyle='rgba(7,6,15,0.78)';o.fillRect(0,H/2-120,W,230);
    o.direction='ltr';o.font="700 96px 'Space Grotesk'";o.textAlign='center';o.fillStyle=C.ink;o.shadowColor=C.mut;o.shadowBlur=30;o.fillText('NEURAL PIXEL LAB',W/2,H/2+10);o.restore();
    o.globalAlpha=ta;label('WHAT HAPPENS WHEN YOU REWRITE THE ALGORITHM?',W/2,H/2+70,26,C.dim,'center');o.globalAlpha=1;}
}
function sceneOutro(sc,t){
  const G=TL.OUTRO_GRID,s=196,gx=56,cols=6,gw=cols*s+(cols-1)*gx,x0=(W-gw)/2,y0=190,rowH=s+120;
  const endFade=ease((t-sc.sent[1][0]+0.2)/1.0);
  for(let i=0;i<G.length;i++){
    const [run,ep,name]=G[i];const ap=0.3+i*0.22;const a=ease((t-ap)/0.4)*(1-endFade);if(a<=0)continue;
    const row=Math.floor(i/cols),inRow=row===0?cols:G.length-cols,rx=(W-(inRow*s+(inRow-1)*gx))/2;
    const cx=rx+(i%cols)*(s+gx),cy=y0+row*rowH;const gg=gridAt(run,ep);
    pixelPanel(cx,cy,s,gg.g,{alpha:a});o.globalAlpha=a;label(name,cx,cy+s+40,21,i===0?C.hi:C.ink,'left','JetBrains Mono');label((gg.acc*100).toFixed(0)+'%',cx+s,cy+s+72,18,C.dim,'right');o.globalAlpha=1;
  }
  const tA=ease((t-sc.sent[1][0]-0.7)/0.8);if(tA>0){o.direction='ltr';o.save();o.globalAlpha=tA;o.font="700 96px 'Space Grotesk'";o.textAlign='center';o.fillStyle=C.ink;o.shadowColor=C.mut;o.shadowBlur=30;o.fillText('NEURAL PIXEL LAB',W/2,H/2);o.restore();
    o.globalAlpha=ease((t-sc.sent[2][0])/1.0);label('ALGORITHMS ARE FORMULAS. PLAY WITH THEM.',W/2,H/2+70,28,C.hi,'center');o.globalAlpha=1;}
}
window.draw=function(T){
  o.direction='ltr';ctx.direction='ltr';
  let sc=TLB.scenes[0];for(const s of TLB.scenes)if(T>=s.start)sc=s;
  const t=T-sc.start;
  background(T);
  // camera push
  const push=1+0.035*(t/sc.dur);
  o.save();o.translate(W/2,H/2);o.scale(push,push);o.translate(-W/2,-H/2);
  if(sc.id==='intro')sceneIntro(sc,t);else if(sc.id==='outro')sceneOutro(sc,t);else sceneExperiment(sc,t);
  o.restore();
  // compose to main canvas with glitch
  ctx.drawImage(off,0,0);
  let gl=0;
  if(sc.mutT!=null){const d=t-sc.mutT;if(d>=0&&d<0.45)gl=1-d/0.45;}
  if(sc.boomT!=null){const d=t-sc.boomT;if(d>=0&&d<1.2)gl=Math.max(gl,1-d/1.2);}
  if(gl>0){const f=Math.floor(T*30);for(let k=0;k<14;k++){const y=Math.floor(rand(f*13+k)*H),h=8+Math.floor(rand(f*7+k)*70),dx=(rand(f*3+k)-.5)*120*gl;ctx.drawImage(off,0,y,W,h,dx,y,W,h);}
    ctx.globalCompositeOperation='lighter';ctx.globalAlpha=0.35*gl;ctx.drawImage(off,12*gl,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
    ctx.fillStyle=`rgba(255,79,123,${0.10*gl})`;ctx.fillRect(0,0,W,H);}
  // scanlines + vignette + grain
  ctx.fillStyle='rgba(0,0,0,0.16)';for(let y=0;y<H;y+=4)ctx.fillRect(0,y,W,2);
  const vg=ctx.createRadialGradient(W/2,H/2,H*0.35,W/2,H/2,H*1.05);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.75)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.globalAlpha=1;ctx.imageSmoothingEnabled=true;ctx.drawImage(grains[Math.floor(T*24)%4],0,0,W,H);ctx.restore();
  // letterbox
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,BAR);ctx.fillRect(0,H-BAR,W,BAR);
  // subtitles (Arabic)
  const tm=sc.sent;const ar=SCRIPT[sc.id];
  for(let i=0;i<tm.length;i++){const[a,b]=tm[i];if(t>=a-0.05&&t<=b+0.45){const al=Math.min(ease((t-a+0.05)/0.2),1-ease((t-b-0.25)/0.2));
    ctx.save();ctx.globalAlpha=al;ctx.direction='rtl';ctx.font="600 40px 'IBM Plex Sans Arabic'";ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#f4f0ff';ctx.fillText(ar[i],W/2,H-BAR/2+2);ctx.restore();}}
  // fades at scene edges
  const fin=1-ease(t/0.5),fout=ease((t-(sc.dur-0.5))/0.5);const f=Math.max(fin,fout);
  if(f>0){ctx.fillStyle=`rgba(0,0,0,${f})`;ctx.fillRect(0,0,W,H);}
};
window.frame=function(T,q){draw(T);return cv.toDataURL('image/jpeg',q||0.92);};
</script>
</body></html>
